# Prepared only; not enabled or published as a workflow.
name: Reviewed UNRULY foundation preview
on:
  push:
    branches: ['preview/browser-foundation-2026-10-04']
    paths: ['.github/workflows/browser-foundation-pages.yml']
permissions:
  contents: read
concurrency:
  group: unruly-foundation-pages
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 66152b32e9544bd383587adbbacbd495e0be3a2f
          persist-credentials: false
      - name: Verify reviewed candidate identity
        run: test "$(git rev-parse HEAD)" = "66152b32e9544bd383587adbbacbd495e0be3a2f"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        with:
          enablement: false
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: prototypes/browser-foundation
      - name: Deploy reviewed static preview
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

