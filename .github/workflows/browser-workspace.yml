          node tests/browser-workspace/server.cjs > tests/browser-workspace/evidence/foundation-server.log 2>&1 &
          qa_server_pid=$!
          trap 'kill "$qa_server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:4173/unruly/ > /dev/null; then break; fi
            sleep 0.1
          done
          curl --fail --silent http://127.0.0.1:4173/unruly/ > /dev/null
          node tests/browser-workspace/tablet-ux.browser.cjs > tests/browser-workspace/evidence/tablet-ux-browser-output.txt 2>&1 || { tail -100 tests/browser-workspace/evidence/tablet-ux-browser-output.txt; qa_result_code=1; }
          node tests/browser-workspace/layer-transform.browser.cjs > tests/browser-workspace/evidence/layer-transform-browser-output.txt 2>&1 || { tail -100 tests/browser-workspace/evidence/layer-transform-browser-output.txt; qa_result_code=1; }
          node tests/browser-workspace/layered-baseline.browser.cjs > tests/browser-workspace/evidence/layered-baseline-output.txt 2>&1 || { tail -100 tests/browser-workspace/evidence/layered-baseline-output.txt; qa_result_code=1; }
          node tests/browser-workspace/render-boundary.browser.cjs > tests/browser-workspace/evidence/render-boundary-output.txt 2>&1 || { tail -100 tests/browser-workspace/evidence/render-boundary-output.txt; qa_result_code=1; }
          node tests/browser-workspace/raster-tiles.browser.cjs > tests/browser-workspace/evidence/raster-tiles-output.txt 2>&1 || { tail -100 tests/browser-workspace/evidence/raster-tiles-output.txt; qa_result_code=1; }
          node tests/browser-workspace/history-cache.browser.cjs > tests/browser-workspace/evidence/history-cache-output.txt 2>&1 || { tail -100 tests/browser-workspace/evidence/history-cache-output.txt; qa_result_code=1; }
          node tests/browser-workspace/layer-compositor.browser.cjs > tests/browser-workspace/evidence/layer-compositor-output.txt 2>&1 || { tail -100 tests/browser-workspace/evidence/layer-compositor-output.txt; qa_result_code=1; }
          node tests/browser-workspace/pixel-paint.browser.cjs > tests/browser-workspace/evidence/pixel-paint-output.txt 2>&1 || { tail -100 tests/browser-workspace/evidence/pixel-paint-output.txt; qa_result_code=1; }
          node tests/browser-workspace/folders.browser.cjs > tests/browser-workspace/evidence/folders-output.txt 2>&1 || { tail -100 tests/browser-workspace/evidence/folders-output.txt; qa_result_code=1; }
          exit "$qa_result_code"
      - name: Image-tip alpha-lock focused gate
        if: matrix.shard == 4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests/browser-workspace/evidence
          node tests/browser-workspace/server.cjs > tests/browser-workspace/evidence/image-tip-paint-server.log 2>&1 &
          qa_tip3_server_pid=$!
          trap 'kill "$qa_tip3_server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:4173/unruly/ > /dev/null; then break; fi
            sleep 0.1
          done
          node tests/browser-workspace/image-tip-paint.browser.cjs > tests/browser-workspace/evidence/image-tip-paint-output.txt 2>&1 || { cat tests/browser-workspace/evidence/image-tip-paint-output.txt; exit 1; }
      - name: Curves and padded Gaussian blur regression
        if: matrix.shard == 4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests/browser-workspace/evidence
          node tests/browser-workspace/server.cjs > tests/browser-workspace/evidence/filter-server.log 2>&1 &
          qa_filter_server_pid=$!
          trap 'kill "$qa_filter_server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:4173/unruly/ > /dev/null; then break; fi
            sleep 0.1
          done
          node tests/browser-workspace/filters.browser.cjs > tests/browser-workspace/evidence/filters-output.txt 2>&1 || { cat tests/browser-workspace/evidence/filters-output.txt; exit 1; }
      - name: Large-layer region regression
        if: matrix.shard == 4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests/browser-workspace/evidence
          node tests/browser-workspace/server.cjs > tests/browser-workspace/evidence/large-region-server.log 2>&1 &
          qa_region_server_pid=$!
          trap 'kill "$qa_region_server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:4173/unruly/ > /dev/null; then break; fi
            sleep 0.1
          done
          node tests/browser-workspace/large-region.browser.cjs > tests/browser-workspace/evidence/large-region-output.txt 2>&1
      - name: CAP2 processed-group retention and capacity/recovery
        if: matrix.shard == 4
        shell: bash
        run: |
          set -euo pipefail
          node tests/browser-workspace/server.cjs > tests/browser-workspace/evidence/cap2-server.log 2>&1 &
          qa_cap2_pid=$!
          trap 'kill "$qa_cap2_pid" 2>/dev/null || true' EXIT
          node tests/browser-workspace/group-cache.browser.cjs > tests/browser-workspace/evidence/group-cache-output.txt 2>&1 || { cat tests/browser-workspace/evidence/group-cache-output.txt; exit 1; }
          node tests/browser-workspace/capacity.browser.cjs > tests/browser-workspace/evidence/capacity-output.txt 2>&1 || { cat tests/browser-workspace/evidence/capacity-output.txt; exit 1; }
      - name: Drawing guides and artwork geometry focused gates
        if: matrix.shard == 5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests/browser-workspace/evidence
          node tests/browser-workspace/server.cjs > tests/browser-workspace/evidence/drawing-tools-server.log 2>&1 &
          qa_draw_server_pid=$!
          trap 'kill "$qa_draw_server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:4173/unruly/ > /dev/null; then break; fi
            sleep 0.1
          done
          node tests/browser-workspace/drawing-tools.browser.cjs > tests/browser-workspace/evidence/drawing-tools-output.txt 2>&1 || { cat tests/browser-workspace/evidence/drawing-tools-output.txt; exit 1; }
      - name: Layer and group colour adjustment regression
        if: matrix.shard == 5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests/browser-workspace/evidence
          node tests/browser-workspace/server.cjs > tests/browser-workspace/evidence/adjustment-server.log 2>&1 &
          qa_adjustment_server_pid=$!
          trap 'kill "$qa_adjustment_server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:4173/unruly/ > /dev/null; then break; fi
            sleep 0.1
          done
          node tests/browser-workspace/adjustments.browser.cjs > tests/browser-workspace/evidence/adjustments-output.txt 2>&1 || { cat tests/browser-workspace/evidence/adjustments-output.txt; exit 1; }
      - name: Actual Chromium layer mask checkpoint
        if: matrix.shard == 5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests/browser-workspace/evidence
          node tests/browser-workspace/server.cjs > tests/browser-workspace/evidence/mask-server.log 2>&1 &
          qa_mask_server_pid=$!
          trap 'kill "$qa_mask_server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:4173/unruly/ > /dev/null; then break; fi
            sleep 0.1
          done
          node tests/browser-workspace/lasso-region.browser.cjs > tests/browser-workspace/evidence/lasso-region-output.txt 2>&1 || { cat tests/browser-workspace/evidence/lasso-region-output.txt; exit 1; }
          node tests/browser-workspace/wand.browser.cjs > tests/browser-workspace/evidence/wand-output.txt 2>&1 || { cat tests/browser-workspace/evidence/wand-output.txt; exit 1; }
          node tests/browser-workspace/paint-workflow.browser.cjs > tests/browser-workspace/evidence/paint-workflow-output.txt 2>&1 || { cat tests/browser-workspace/evidence/paint-workflow-output.txt; exit 1; }
          if ! command -v pdfinfo >/dev/null || ! command -v pdftoppm >/dev/null; then sudo apt-get update -qq; sudo apt-get install -y poppler-utils; fi
          node tests/browser-workspace/image-import.browser.cjs > tests/browser-workspace/evidence/image-import-output.txt 2>&1 || { cat tests/browser-workspace/evidence/image-import-output.txt; exit 1; }
          node tests/browser-workspace/text.browser.cjs > tests/browser-workspace/evidence/text-output.txt 2>&1 || { cat tests/browser-workspace/evidence/text-output.txt; exit 1; }
          node tests/browser-workspace/clipping.browser.cjs > tests/browser-workspace/evidence/clipping-output.txt 2>&1 || { cat tests/browser-workspace/evidence/clipping-output.txt; exit 1; }
          node tests/browser-workspace/masks.browser.cjs > tests/browser-workspace/evidence/masks-output.txt 2>&1 || { cat tests/browser-workspace/evidence/masks-output.txt; exit 1; }
      - name: Motion Trace saved cues and reversible presentation
        if: matrix.shard == 5
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          node tests/browser-workspace/server.cjs > tests/browser-workspace/evidence/motion-server.log 2>&1 &
          qa_motion_pid=$!
          trap 'kill "$qa_motion_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:4173/unruly/ > /dev/null; then break; fi
            sleep .1
          done
          node tests/browser-workspace/timelapse.browser.cjs > tests/browser-workspace/evidence/timelapse-output.txt 2>&1 || { cat tests/browser-workspace/evidence/timelapse-output.txt; exit 1; }
          node tests/browser-workspace/motion.browser.cjs > tests/browser-workspace/evidence/motion-output.txt 2>&1 || { cat tests/browser-workspace/evidence/motion-output.txt; exit 1; }
      - name: Bind tested identities
        if: always()
        shell: bash
        run: |
          mkdir -p tests/browser-workspace/evidence
          git rev-parse HEAD > tests/browser-workspace/evidence/commit.txt
          sha256sum prototypes/browser-workspace/* tests/browser-workspace/*.cjs tests/browser-workspace/*.mjs tests/browser-workspace/package.json tests/browser-workspace/package-lock.json tests/browser-workspace/fixtures/*.txt .github/workflows/browser-workspace.yml > tests/browser-workspace/evidence/source-sha256.txt
      - name: Record shard completion
        run: |
          printf '%s\n' '${{ github.sha }}' > tests/browser-workspace/evidence/shard-${{ matrix.shard }}.txt
      - name: Upload bounded QA evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unruly-browser-workspace-shard-${{ matrix.shard }}
          path: tests/browser-workspace/evidence/
          if-no-files-found: error
          retention-days: 7

  cumulative-qa:
    name: All cumulative shards required
    needs: [foundation-qa]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Reject failed cancelled or skipped shards
        env:
          SHARD_RESULT: ${{ needs.foundation-qa.result }}
        run: test "$SHARD_RESULT" = success
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: unruly-browser-workspace-shard-*
          path: tests/browser-workspace/evidence
          merge-multiple: true
      - name: Require six matching source identities
        env:
          CANDIDATE: ${{ github.sha }}
        run: |
          for shard in 0 1 2 3 4 5; do
            test "$(cat tests/browser-workspace/evidence/shard-$shard.txt)" = "$CANDIDATE"
          done
          test "$(cat tests/browser-workspace/evidence/commit.txt)" = "$CANDIDATE"
      - name: Upload canonical cumulative evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unruly-browser-workspace-qa
          path: tests/browser-workspace/evidence/
          if-no-files-found: error
          retention-days: 7
