# Tablet UX checkpoint: additive shape, picker and touch-transform coverage.
name: UNRULY browser cumulative QA
on:
  push:
    branches: ['main', 'CHG-UNRULY-**', 'preview/drawing-workspace-2026-10-04', 'preview/vector-selection-2026-10-06', 'preview/performance-foundation-2026-10-06', 'preview/drawing-ux-u1-2026-10-06', 'preview/drawing-ux-u2-2026-10-06', 'preview/drawing-ux-u3-2026-10-07', 'preview/pen-input-p1-2026-10-07', 'preview/pressure-curve-c1-2026-10-07', 'preview/layer-pen-settings-l1-2026-10-08', 'work/erase1-intersection-limit-2026-10-08', 'preview/cumulative-erase1-press2-2026-10-09', 'work/g02-held-history-2026-10-09', 'work/g02-view-fit-2026-10-09', 'work/c04-pencil-grain-2026-10-09', 'work/ui-fullscreen-toggle-2026-10-09', 'work/airbrush-size-panel-2026-10-09', 'work/brush-size-percent-2026-10-10', 'CHG-UNRULY-SIZE-1010/percent-contract', 'CHG-UNRULY-CUMULATIVE-1010/brush-comparison', 'CHG-UNRULY-B02-1010/advanced-brush-controls', 'CHG-UNRULY-B03-1010/smudge', 'CHG-UNRULY-UX1-1010/tablet-gestures', 'CHG-UNRULY-UX2-1010/layer-transforms-performance', 'CHG-UNRULY-PERF1-1011/layered-baseline', 'CHG-UNRULY-PERF2-1011/renderer-boundary', 'CHG-UNRULY-PERF3A-1011/sparse-raster-storage', 'CHG-UNRULY-PERF3B-1011/cache-and-history', 'CHG-UNRULY-PERF4-1011/retained-compositing', 'CHG-UNRULY-PAINT1-1011/raster-paint-and-smudge', 'CHG-UNRULY-FOLDER1-1011/layer-folders', 'CHG-UNRULY-MASK1-1011/layer-masks', 'CHG-UNRULY-CLIP1-1011/clipping-alpha-lock']
    paths:
      - 'prototypes/browser-workspace/**'
      - 'tests/browser-workspace/**'
      - '.github/workflows/browser-workspace.yml'
permissions:
  contents: read
concurrency:
  group: unruly-browser-workspace-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation-qa:
    name: Cumulative shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install isolated pinned browser QA tooling
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix tests/browser-workspace
          cd tests/browser-workspace
          npx playwright install --with-deps chromium
      - name: CORE1 edit persistence and paint extent gate
        if: matrix.shard == 5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests/browser-workspace/evidence
          node --test tests/browser-workspace/core-perf.model.test.mjs tests/browser-workspace/raster-extent.model.test.mjs > tests/browser-workspace/evidence/core-model-output.txt 2>&1 || { cat tests/browser-workspace/evidence/core-model-output.txt; exit 1; }
          node tests/browser-workspace/server.cjs > tests/browser-workspace/evidence/core-server.log 2>&1 &
          qa_core_pid=$!
          trap 'kill "$qa_core_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:4173/unruly/ > /dev/null; then break; fi
            sleep .1
          done
          node tests/browser-workspace/save-flush.browser.cjs > tests/browser-workspace/evidence/core-save-flush-output.txt 2>&1 || { cat tests/browser-workspace/evidence/core-save-flush-output.txt; exit 1; }
      - name: POSE1A focused reference gate
        if: matrix.shard == 5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests/browser-workspace/evidence
          node --test tests/browser-workspace/pose.model.test.mjs > tests/browser-workspace/evidence/pose-model-output.txt 2>&1 || { cat tests/browser-workspace/evidence/pose-model-output.txt; exit 1; }
          node tests/browser-workspace/server.cjs > tests/browser-workspace/evidence/pose-server.log 2>&1 &
          qa_pose_pid=$!
          trap 'kill "$qa_pose_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:4173/unruly/ > /dev/null; then break; fi
            sleep .1
          done
          node tests/browser-workspace/pose.browser.cjs > tests/browser-workspace/evidence/pose-browser-output.txt 2>&1 || { cat tests/browser-workspace/evidence/pose-browser-output.txt; exit 1; }
      - name: Pattern deformation focused gate
        if: matrix.shard == 0
