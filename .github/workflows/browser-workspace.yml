name: Quarantined browser foundation QA
on:
  push:
    branches: ['preview/drawing-workspace-2026-10-04']
    paths:
      - 'prototypes/browser-workspace/**'
      - 'tests/browser-workspace/**'
      - '.github/workflows/browser-workspace.yml'
permissions:
  contents: read
concurrency:
  group: unruly-browser-workspace-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install isolated pinned browser QA tooling
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix tests/browser-workspace
          cd tests/browser-workspace
          npx playwright install --with-deps chromium
      - name: Independent unit and actual Chromium journeys
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests/browser-workspace/evidence
          node --version > tests/browser-workspace/evidence/node-version.txt
          node --test tests/browser-workspace/model.test.mjs > tests/browser-workspace/evidence/model-output.txt 2>&1
          node tests/browser-workspace/server.cjs > tests/browser-workspace/evidence/server.log 2>&1 &
          qa_server_pid=$!
          trap 'kill "$qa_server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:4173/unruly/ > /dev/null; then break; fi
            sleep 0.1
          done
          node tests/browser-workspace/browser.test.cjs > tests/browser-workspace/evidence/browser-output.txt 2>&1
      - name: Bind tested identities
        if: always()
        shell: bash
        run: |
          mkdir -p tests/browser-workspace/evidence
          git rev-parse HEAD > tests/browser-workspace/evidence/commit.txt
          sha256sum prototypes/browser-workspace/* tests/browser-workspace/*.cjs tests/browser-workspace/*.mjs tests/browser-workspace/package.json tests/browser-workspace/package-lock.json .github/workflows/browser-workspace.yml > tests/browser-workspace/evidence/source-sha256.txt
      - name: Upload bounded QA evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unruly-browser-workspace-qa
          path: tests/browser-workspace/evidence/
          if-no-files-found: error
          retention-days: 7
