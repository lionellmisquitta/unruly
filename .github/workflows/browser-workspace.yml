      - name: Cumulative foundation partition 0
        if: matrix.shard == 0
        shell: bash
        run: |
          set -euo pipefail
          qa_result_code=0
          mkdir -p tests/browser-workspace/evidence
          node --version > tests/browser-workspace/evidence/node-version.txt
          node --test tests/browser-workspace/tip-guides.model.test.mjs tests/browser-workspace/ci-contract.test.mjs tests/browser-workspace/composition.model.test.mjs tests/browser-workspace/palettes.model.test.mjs tests/browser-workspace/image-tip-paint.model.test.mjs tests/browser-workspace/drawing-tools.model.test.mjs tests/browser-workspace/stabilization.model.test.mjs tests/browser-workspace/timelapse.model.test.mjs tests/browser-workspace/motion.model.test.mjs tests/browser-workspace/group-cache.model.test.mjs tests/browser-workspace/capacity.model.test.mjs tests/browser-workspace/grain.model.test.mjs tests/browser-workspace/custom-tips.model.test.mjs tests/browser-workspace/filters.model.test.mjs tests/browser-workspace/adjustments.model.test.mjs tests/browser-workspace/model.test.mjs tests/browser-workspace/selection.test.mjs tests/browser-workspace/u1.model.test.mjs tests/browser-workspace/u2.model.test.mjs tests/browser-workspace/u3.model.test.mjs tests/browser-workspace/pen.model.test.mjs tests/browser-workspace/curve.model.test.mjs tests/browser-workspace/lset.model.test.mjs tests/browser-workspace/press2.model.test.mjs tests/browser-workspace/g02.model.test.mjs tests/browser-workspace/g02.fit.model.test.mjs tests/browser-workspace/c04.model.test.mjs tests/browser-workspace/airbrush-size.model.test.mjs tests/browser-workspace/brush-size-percent.model.test.mjs tests/browser-workspace/recipe.model.test.mjs tests/browser-workspace/smudge.model.test.mjs tests/browser-workspace/tablet-ux.model.test.mjs tests/browser-workspace/layer-transform.test.mjs tests/browser-workspace/render-contract.model.test.mjs tests/browser-workspace/raster-tiles.model.test.mjs tests/browser-workspace/history-cache.model.test.mjs tests/browser-workspace/layer-compositor.model.test.mjs tests/browser-workspace/pixel-paint.model.test.mjs tests/browser-workspace/folders.model.test.mjs tests/browser-workspace/masks.model.test.mjs tests/browser-workspace/clipping.model.test.mjs tests/browser-workspace/text.model.test.mjs tests/browser-workspace/image-import.model.test.mjs tests/browser-workspace/wand.model.test.mjs tests/browser-workspace/lasso-region.model.test.mjs tests/browser-workspace/large-region.model.test.mjs tests/browser-workspace/path-selection.model.test.mjs tests/browser-workspace/magnetic-selection.model.test.mjs tests/browser-workspace/bucket-fill.model.test.mjs tests/browser-workspace/polygon-fill.model.test.mjs > tests/browser-workspace/evidence/model-output.txt 2>&1 || qa_result_code=1
