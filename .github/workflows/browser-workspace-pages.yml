name: Reviewed UNRULY workspace preview
on:
  push:
    branches: ['preview/browser-foundation-2026-10-04']
    paths: ['.github/workflows/browser-workspace-pages.yml']
permissions:
  contents: read
concurrency:
  group: unruly-workspace-pages
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 467941978dee54608eb5b96a33db20120636fc99
          persist-credentials: false
      - name: Verify reviewed candidate identity
        run: test "$(git rev-parse HEAD)" = "467941978dee54608eb5b96a33db20120636fc99"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        with:
          enablement: false
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: prototypes/browser-workspace
      - name: Deploy reviewed static preview
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e


      - name: Verify every hosted application asset against reviewed bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/unruly-hosted
          for source in prototypes/browser-workspace/*; do
            asset=$(basename "$source")
            matched=false
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error "https://lionellmisquitta.github.io/unruly/$asset?lset1=467941978dee54608eb5b96a33db20120636fc99" -o "/tmp/unruly-hosted/$asset" && cmp --silent "$source" "/tmp/unruly-hosted/$asset"; then
                matched=true
                break
              fi
              sleep 5
            done
            test "$matched" = true
            sha256sum "/tmp/unruly-hosted/$asset"
          done
