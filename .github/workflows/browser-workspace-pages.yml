name: Reviewed UNRULY browser publication
on:
  push:
    branches: ['main']
    paths: ['.github/workflows/browser-workspace-pages.yml']
permissions:
  contents: read
concurrency:
  group: unruly-workspace-pages
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4ffc7d1383fc7f2f9a3591655ed5cce937c64fc1
          persist-credentials: false
      - name: Verify reviewed candidate identity
        run: test "$(git rev-parse HEAD)" = "4ffc7d1383fc7f2f9a3591655ed5cce937c64fc1"
      - name: Verify downloaded cumulative QA evidence against pinned source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/lionellmisquitta/unruly/actions/artifacts/12800979190/zip" -o /tmp/unruly-cumulative.zip
          python - <<'PY'
          import hashlib,json,pathlib,re,zipfile
          candidate="4ffc7d1383fc7f2f9a3591655ed5cce937c64fc1"
          archive=pathlib.Path("/tmp/unruly-cumulative.zip")
          digest="7f23e3504c317e035928d35698f6269e251200b593841765ae9b5b28b41afcf9"
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==digest,"Artifact digest mismatch"
          with zipfile.ZipFile(archive) as z:
              names=z.namelist()
              def read(name):
                  matches=[n for n in names if n==name or n.endswith("/"+name)]
                  assert len(matches)==1,(name,matches)
                  return z.read(matches[0]).decode()
              assert read("commit.txt").strip()==candidate,"Wrong tested commit"
              for shard in range(6):
                  assert read("shard-"+str(shard)+".txt").strip()==candidate,"Wrong shard source"
              hashes={}
              for line in read("source-sha256.txt").splitlines():
                  sha,path=line.split(None,1)
                  path=path.lstrip("*")
                  file=pathlib.Path(path)
                  assert not file.is_absolute() and ".." not in file.parts
                  assert hashlib.sha256(file.read_bytes()).hexdigest()==sha,("Source mismatch",path)
                  hashes[path]=sha
              assert len(hashes)==218,("Unexpected source hash count",len(hashes))
              assert "v10-20261028-lag-gallery-1" in pathlib.Path("prototypes/browser-workspace/sw.js").read_text(), "Offline cache not updated"
              workflow=pathlib.Path(".github/workflows/browser-workspace.yml").read_text()
              test_root=pathlib.Path("tests/browser-workspace")
              test_files={str(p) for p in test_root.iterdir() if p.name.endswith((".test.mjs",".browser.cjs")) or p.name=="browser.test.cjs"}
              invoked=set()
              for line in workflow.splitlines():
                  command=line.strip()
                  if re.match(r"^node\s+(?:--test\s+|tests/browser-workspace/)",command):
                      invoked.update(re.findall(r"tests/browser-workspace/[\w.-]+\.(?:mjs|cjs)",command.split(" > ")[0]))
              assert len(test_files)==116,("Unexpected test inventory",len(test_files))
              assert test_files<=invoked,("Uninvoked tests",sorted(test_files-invoked))
              assert test_files<=hashes.keys(),"Test inventory missing from source manifest"
              cases=[]
              def collect(value):
                  if isinstance(value,dict):
                      if isinstance(value.get("status"),str):
                          cases.append({"id":value.get("id") or value.get("name") or current_report+"#"+str(len(cases)+1),"status":value["status"]})
                      else:
                          for v in value.values():collect(v)
                  elif isinstance(value,list):
                      for v in value:collect(v)
              for name in names:
                  if name.endswith(".json"):
                          current_report=name
                          collect(json.loads(z.read(name)))
              legacy_checks=[]
              for report,marker,case_id in [("fullscreen-browser-output.txt","FULLSCREENB01 PASS","FULLSCREENB01"),("airbrush-size-browser-output.txt","AIRBRUSH BROWSER PASS","AIRBRUSH-BROWSER")]:
                  assert re.search(r"^"+re.escape(marker)+r"\s*$",read(report),re.M),("Missing console-only PASS",report)
                  legacy_checks.append({"id":case_id,"status":"PASS"})
              print("DRAW1A_QA_SCHEMA="+json.dumps({"sourceHashes":len(hashes),"browserScenarios":len(cases)}))
              assert len(cases)==549,("Unexpected browser count",len(cases))
              assert all(c["status"].upper()=="PASS" for c in cases),"Browser failure"
              reports=["model-output.txt","pattern-warp-model-output.txt","chain1-model-output.txt","connectors-model-output.txt","pose-model-output.txt","core-model-output.txt"]
              for report,count in zip(reports,[578,22,27,17,49,6]):
                  text=read(report)
                  assert re.search(r"(?:#|ℹ) tests "+str(count)+r"\b",text),("Model count absent",report,count)
                  assert re.search(r"(?:#|ℹ) fail 0\b",text),("Model failure",report)
                  for field in ["skipped","cancelled","todo"]:
                      assert re.search(r"(?:#|ℹ) "+field+r" 0\b",text),("Unexecuted model tests",report,field)
              for guard in ["CIG01","CIPAR01","CIPAR03"]:
                  assert re.search(r"^ok \d+ - "+guard+r"\b",read("model-output.txt"),re.M),("Coverage guard did not pass",guard)
              print("DRAW1A_CASES="+json.dumps(cases,separators=(",",":")))
              print("DRAW1A_QA_RECEIPT="+json.dumps({"source":candidate,"artifactId":12800979190,"artifactDigest":digest,"modelTests":699,"modelFailures":0,"browserScenarios":len(cases),"sourceHashCount":len(hashes),"testFiles":len(test_files),"allTestFilesInvoked":True,"sourceHashes":hashes,"modelReports":reports,"legacyConsoleChecks":legacy_checks},separators=(",",":")))
          PY
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        with:
          enablement: false
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: prototypes/browser-workspace
      - name: Deploy reviewed static preview
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e


      - name: Verify every hosted application asset against reviewed bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/unruly-hosted
          for source in prototypes/browser-workspace/*; do
            asset=$(basename "$source")
            matched=false
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error "https://lionellmisquitta.github.io/unruly/$asset?draw1a=4ffc7d1383fc7f2f9a3591655ed5cce937c64fc1" -o "/tmp/unruly-hosted/$asset" && cmp --silent "$source" "/tmp/unruly-hosted/$asset"; then
                matched=true
                break
              fi
              sleep 5
            done
            test "$matched" = true
            sha256sum "/tmp/unruly-hosted/$asset"
          done
