name: Reviewed UNRULY browser publication
on:
  push:
    branches: ['main']
    paths: ['.github/workflows/browser-workspace-pages.yml']
permissions:
  contents: read
concurrency:
  group: unruly-workspace-pages
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 05759fc53c538360da09d661a27fe2faf354f535
          persist-credentials: false
      - name: Verify reviewed candidate identity
        run: test "$(git rev-parse HEAD)" = "05759fc53c538360da09d661a27fe2faf354f535"
      - name: Verify downloaded cumulative QA evidence against pinned source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/lionellmisquitta/unruly/actions/artifacts/12103831006/zip" -o /tmp/unruly-cumulative.zip
          python - <<'PY'
          import hashlib,json,pathlib,re,zipfile
          candidate="05759fc53c538360da09d661a27fe2faf354f535"
          archive=pathlib.Path("/tmp/unruly-cumulative.zip")
          digest="0e992a6e15274edc8302d2f208c3dfaab6390f3efafe8ce293e20ab400e5f9db"
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==digest,"Artifact digest mismatch"
          with zipfile.ZipFile(archive) as z:
              names=z.namelist()
              def read(name):
                  matches=[n for n in names if n==name or n.endswith("/"+name)]
                  assert len(matches)==1,(name,matches)
                  return z.read(matches[0]).decode()
              assert read("commit.txt").strip()==candidate,"Wrong tested commit"
              hashes={}
              for line in read("source-sha256.txt").splitlines():
                  sha,path=line.split(None,1)
                  path=path.lstrip("*")
                  file=pathlib.Path(path)
                  assert not file.is_absolute() and ".." not in file.parts
                  assert hashlib.sha256(file.read_bytes()).hexdigest()==sha,("Source mismatch",path)
                  hashes[path]=sha
              assert len(hashes)==194,("Unexpected source hash count",len(hashes))
              cases=[]
              def collect(value):
                  if isinstance(value,dict):
                      if isinstance(value.get("status"),str):
                          cases.append({"id":value.get("id") or value.get("name") or current_report+"#"+str(len(cases)+1),"status":value["status"]})
                      else:
                          for v in value.values():collect(v)
                  elif isinstance(value,list):
                      for v in value:collect(v)
              for name in names:
                  if name.endswith(".json"):
                          current_report=name
                          collect(json.loads(z.read(name)))
              legacy_checks=[]
              for report,marker,case_id in [("fullscreen-browser-output.txt","FULLSCREENB01 PASS","FULLSCREENB01"),("airbrush-size-browser-output.txt","AIRBRUSH BROWSER PASS","AIRBRUSH-BROWSER")]:
                  assert re.search(r"^"+re.escape(marker)+r"\s*$",read(report),re.M),("Missing console-only PASS",report)
                  legacy_checks.append({"id":case_id,"status":"PASS"})
              print("MESH1_QA_SCHEMA="+json.dumps({"sourceHashes":len(hashes),"browserScenarios":len(cases)}))
              assert len(cases)==443,("Unexpected browser count",len(cases))
              assert all(c["status"].upper()=="PASS" for c in cases),"Browser failure"
              reports=["model-output.txt","pattern-warp-model-output.txt","chain1-model-output.txt"]
              for report,count in zip(reports,[509,22,27]):
                  text=read(report)
                  assert re.search(r"(?:#|ℹ) tests "+str(count)+r"\b",text),("Model count absent",report,count)
                  assert re.search(r"(?:#|ℹ) fail 0\b",text),("Model failure",report)
              print("MESH1_CASES="+json.dumps(cases,separators=(",",":")))
              print("MESH1_QA_RECEIPT="+json.dumps({"source":candidate,"artifactId":12103831006,"artifactDigest":digest,"modelTests":558,"modelFailures":0,"browserScenarios":len(cases),"sourceHashCount":len(hashes),"sourceHashes":hashes,"modelReports":reports,"legacyConsoleChecks":legacy_checks},separators=(",",":")))
          PY
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        with:
          enablement: false
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: prototypes/browser-workspace
      - name: Deploy reviewed static preview
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e


      - name: Verify every hosted application asset against reviewed bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/unruly-hosted
          for source in prototypes/browser-workspace/*; do
            asset=$(basename "$source")
            matched=false
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error "https://lionellmisquitta.github.io/unruly/$asset?chain1=05759fc53c538360da09d661a27fe2faf354f535" -o "/tmp/unruly-hosted/$asset" && cmp --silent "$source" "/tmp/unruly-hosted/$asset"; then
                matched=true
                break
              fi
              sleep 5
            done
            test "$matched" = true
            sha256sum "/tmp/unruly-hosted/$asset"
          done
