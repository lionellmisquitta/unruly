name: Painting batch preflight
on:
  push:
    branches: ['CHG-UNRULY-TIP2CAP-1015/**', 'CHG-UNRULY-CAP2-1015/**']
    paths: ['prototypes/browser-workspace/**', 'tests/browser-workspace/**', '.github/workflows/painting-batch-preflight.yml']
permissions:
  contents: read
concurrency:
  group: painting-preflight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  grain-capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix tests/browser-workspace
          cd tests/browser-workspace
          npx playwright install --with-deps chromium
      - name: Grain gate then capacity and recovery probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests/browser-workspace/evidence
          node --test tests/browser-workspace/group-cache.model.test.mjs tests/browser-workspace/capacity.model.test.mjs tests/browser-workspace/grain.model.test.mjs > tests/browser-workspace/evidence/grain-model.txt 2>&1
          node tests/browser-workspace/server.cjs > tests/browser-workspace/evidence/preflight-server.log 2>&1 &
          qa_batch_pid=$!
          trap 'kill "$qa_batch_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:4173/unruly/ >/dev/null; then break; fi
            sleep .1
          done
          node tests/browser-workspace/group-cache.browser.cjs > tests/browser-workspace/evidence/group-cache-output.txt 2>&1 || { cat tests/browser-workspace/evidence/group-cache-output.txt; exit 1; }
          node tests/browser-workspace/grain.browser.cjs > tests/browser-workspace/evidence/grain-output.txt 2>&1 || { cat tests/browser-workspace/evidence/grain-output.txt; exit 1; }
          node tests/browser-workspace/capacity.browser.cjs > tests/browser-workspace/evidence/capacity-output.txt 2>&1 || { cat tests/browser-workspace/evidence/capacity-output.txt; exit 1; }
      - name: Bind preflight identities
        if: always()
        run: |
          git rev-parse HEAD > tests/browser-workspace/evidence/commit.txt
          sha256sum prototypes/browser-workspace/* tests/browser-workspace/grain* tests/browser-workspace/capacity* .github/workflows/painting-batch-preflight.yml > tests/browser-workspace/evidence/preflight-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: painting-preflight
          path: tests/browser-workspace/evidence/
          retention-days: 7
