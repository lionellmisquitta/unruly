name: Timelapse preflight
on:
  push:
    branches: ['CHG-UNRULY-TIME1-1015/**']
    paths: ['prototypes/browser-workspace/**', 'tests/browser-workspace/**', '.github/workflows/timelapse-preflight.yml']
permissions:
  contents: read
concurrency:
  group: timelapse-preflight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  timelapse:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix tests/browser-workspace
          cd tests/browser-workspace
          npx playwright install --with-deps chromium
      - name: Timelapse model and actual Chromium gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests/browser-workspace/evidence
          node --test tests/browser-workspace/timelapse.model.test.mjs > tests/browser-workspace/evidence/timelapse-model.txt 2>&1
          node tests/browser-workspace/server.cjs > tests/browser-workspace/evidence/timelapse-server.log 2>&1 &
          qa_timelapse_pid=$!
          trap 'kill "$qa_timelapse_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:4173/unruly/ > /dev/null; then break; fi
            sleep .1
          done
          node tests/browser-workspace/timelapse.browser.cjs > tests/browser-workspace/evidence/timelapse-output.txt 2>&1 || { cat tests/browser-workspace/evidence/timelapse-output.txt; exit 1; }
      - name: Bind exact identities
        if: always()
        run: |
          git rev-parse HEAD > tests/browser-workspace/evidence/commit.txt
          sha256sum prototypes/browser-workspace/* tests/browser-workspace/timelapse* .github/workflows/timelapse-preflight.yml > tests/browser-workspace/evidence/timelapse-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: timelapse-preflight
          path: tests/browser-workspace/evidence/
          retention-days: 7
