questions:
  answered:
  - id: Q-001
    answer: Surface/Surface Pen; Lenovo MT14/pen second screen; Xiaomi Pad/Xiaomi
      Pen
  - id: Q-002
    answer: Painting and whiteboarding equally from release one; add timelapse
  - id: Q-003
    answer: Google Drive sync from day one; open source
  - id: Q-004
    answer: Personal across devices; add vector/raster, gap fill, node/intersection
      eraser and colour/texture controls
  - id: Q-005
    answer: Portable Windows folder app and Android APK; automated cross-model build/QA/Gatekeeper
      loop
  - id: Q-006
    answer: Surface Pro 9 screenshot confirms i7-1265U and 32 GB RAM; user confirms
      64-bit OS, Xiaomi Pad 7 Pro target and incremental graph requirement.
  - id: Q-007
    answer: AI included in release one after base validation; human review in checkpoint
      batches.
  - id: Q-008
    answer: Pen draws/fingers navigate; include finger smudge and reference Procreate
      behaviour.
  - id: Q-009
    answer: Experimental Procreate brush import accepted.
  - id: Q-010
    answer: Both images and selected PDF pages.
  - id: Q-011
    answer: All text boxes/sticky notes/attached connectors; fonts/size; reference
      panel, colour workflows, inking, dimensions/DPI and exchange research requested.
  - id: Q-012
    answer: Stationary hold eyedropper and draw-and-hold shape recognition accepted.
  - id: Q-013
    answer: Keep both sync-conflicting revisions and let user choose continuing version.
  - id: Q-014
    answer: Private personal GitHub repository lionellmisquitta/unruly; user created
      it and connector verified private visibility and push permissions.
  - id: Q-015
    answer: Both object and camera motion; manual and timed playback; presentation
      restore default with optional commit.
  pending: []
requirements:
  - {"id": "REQ-001", "statement": "Infinite canvas, zoom, pan, multiple saved boards, cut/copy/paste, lasso, ruler, eraser.", "status": "confirmed_scope", "source_ref": "PROJECT_STATE.md"}
  - {"id": "REQ-002", "statement": "Vector and raster drawing on one board; editable curve control points and dedicated curve pen tool.", "status": "confirmed_scope", "source_ref": "PROJECT_STATE.md"}
  - {"id": "REQ-003", "statement": "Pen, pencil, marker, airbrush, watercolour, imported texture brushes.", "status": "confirmed_scope", "source_ref": "PROJECT_STATE.md"}
  - {"id": "REQ-004", "statement": "Layers, clipping masks, transparency/opacity and blending modes; brush size and opacity controls, layer transforms.", "status": "confirmed_scope", "source_ref": "PROJECT_STATE.md"}
  - {"id": "REQ-005", "statement": "Pressure-sensitive drawing and adjustable stabilization for handwriting.", "status": "confirmed_scope", "source_ref": "PROJECT_STATE.md"}
  - {"id": "REQ-006", "statement": "Two-finger double tap undo, three-finger double tap redo, stationary hold colour picker and held-stroke endpoint shape/line recognition (GDEC-016).", "status": "confirmed_scope", "source_ref": "PROJECT_STATE.md"}
  - {"id": "REQ-007", "statement": "Gaussian blur and gap-aware paint bucket inspired by Clip Studio Paint.", "status": "confirmed_scope", "source_ref": "PROJECT_STATE.md"}
  - {"id": "REQ-008", "statement": "Colour wheel, hue/saturation controls and different paper options; review Concepts colour/workspace UX alongside Procreate and HiPaint.", "status": "confirmed_scope", "source_ref": "PROJECT_STATE.md"}
  - {"id": "REQ-009", "statement": "Local timelapse recording and video export; framing and retention remain unresolved.", "status": "confirmed_scope", "source_ref": "PROJECT_STATE.md"}
  - {"id": "REQ-010", "statement": "Google Drive synchronization with local offline work.", "status": "confirmed_scope", "source_ref": "PROJECT_STATE.md"}
  - {"id": "REQ-011", "statement": "Optional BYOK AI to summarize/diagram selected ideas and export DOCX, PDF, JPG. Included in first release after base validation (GDEC-010); provider support remains unresolved.", "status": "confirmed_scope", "source_ref": "PROJECT_STATE.md"}
  - {"id": "REQ-012", "statement": "Automated checkpoint coding, adversarial frontend and backend/engine tests, Gatekeeper review, merge and merged regression, with resumable state.", "status": "confirmed_scope", "source_ref": "PROJECT_STATE.md"}
  - {"id": "REQ-013", "statement": "Maintain the project knowledge graph during design and coding, not retrospectively at release. Graph Generator capture mode is active. This snapshot includes an initial capture delta and update protocol, not a validated full KGP export or viewer package.", "status": "confirmed_scope", "source_ref": "PROJECT_STATE.md"}
  - {"id": "REQ-014", "statement": "Reference image box, colour picker, good inking pens, long-touch colour sampling, Concepts-inspired colour shades/palettes and transient pop-out controls.", "status": "confirmed_scope", "source_ref": "PROJECT_STATE.md"}
  - {"id": "REQ-015", "statement": "Canvas/artboard dimensions and DPI controls.", "status": "confirmed_scope", "source_ref": "PROJECT_STATE.md"}
  - {"id": "REQ-016", "statement": "Exchange artwork with Clip Studio Paint and Procreate. Native-format or PSD route is not yet approved.", "status": "confirmed_scope", "source_ref": "PROJECT_STATE.md"}
  - {"id": "REQ-017", "statement": "Support moving selected/lassoed content along a path and audience-view pan/zoom. Both manual and timed playback are included; manual advance is default. Offer presentation-only motion with original layout restored (default) and an explicit commit-to-board option. Add a dedicated checkpoint after selection/transforms are validated. Individual cue parameters and recording semantics remain proposed.", "status": "confirmed_scope", "source_ref": "PROJECT_STATE.md"}
